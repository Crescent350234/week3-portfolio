<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>孟雨航的前端网页作品集</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="portfolio-shell">
      <header class="portfolio-header">
        <h1 class="portfolio-title">
          <span class="portfolio-title__name">孟雨航的</span>
          <span class="portfolio-title__highlight">前端网页作品集</span>
        </h1>
        <p class="portfolio-subtitle">这是我的前端网页作品，点击跳转到具体的页面！</p>
      </header>

      <section class="works-grid" aria-label="作品展示">
        <article class="work-card">
          <div class="work-card__preview">
            <img src="images/work1.png" alt="Quiz Time 预览" />
          </div>
          <div class="work-card__body">
            <h2 class="work-card__title">Quiz Time</h2>
            <a class="work-card__btn" href="https://week2-quiz3.vercel.app/" target="_blank" rel="noreferrer">Quiz</a>
          </div>
        </article>

        <article class="work-card">
          <div class="work-card__preview">
            <img src="images/work2.png" alt="Register Form 预览" />
          </div>
          <div class="work-card__body">
            <h2 class="work-card__title">Register Form</h2>
            <a class="work-card__btn" href="https://week1-registration2.vercel.app/" target="_blank" rel="noreferrer">Register</a>
          </div>
        </article>

        <article class="work-card">
          <div class="work-card__preview">
            <img src="images/work3.png" alt="Recipe Finder 预览" />
          </div>
          <div class="work-card__body">
            <h2 class="work-card__title">Recipe Finder</h2>
            <a class="work-card__btn" href="https://week2-recipe-search2.vercel.app/" target="_blank" rel="noreferrer">Recipe</a>
          </div>
        </article>
      </section>

      <footer class="portfolio-footer">
        <p>孟雨航 · 计算机科学与技术 · 2026</p>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
