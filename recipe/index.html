<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="search-view" id="search-view" aria-labelledby="page-title">
        <header class="hero">
          <h1 id="page-title"><i class="fa-solid fa-utensils" aria-hidden="true"></i> Recipe Finder</h1>
          <p class="subtitle">Find delicious recipes from around the world</p>
          <p class="source-note">Data from <a href="https://www.themealdb.com/" target="_blank" rel="noreferrer">TheMealDB</a> <span aria-hidden="true">👨‍🍳</span></p>
        </header>

        <form class="search-form" id="search-form">
          <label class="sr-only" for="search-input">Search for meals or keywords</label>
          <input id="search-input" type="search" placeholder="Search for meals or keywords" autocomplete="off" />
          <button type="submit" class="search-btn"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i> Search</button>
        </form>

        <p class="recent-searches" id="recent-searches" hidden></p>
        <h2 class="result-heading" id="result-heading"></h2>
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div class="meals-container" id="meals"></div>
      </section>

      <section class="details-view hidden" id="meal-details" aria-labelledby="details-title">
        <button class="back-btn" id="back-btn" type="button"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to recipes</button>
        <article class="meal-details-content" id="meal-details-content"></article>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
